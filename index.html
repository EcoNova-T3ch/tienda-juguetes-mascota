<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login con Clave Estática</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <section class="login-container">
      <div class="login-box">
        <h2>Acceso Restringido</h2>

        <form onsubmit="return validarLogin(event);">
          <div class="mini-logo">
            <a href="#" aria-label="PetBox"
              ><img src="img/Logo-sin-fondo.png" alt="Logo-Login"
            /></a>
          </div>
          <div class="input-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Introduce tu email"
              required
            />
          </div>

          <div class="input-group">
            <label for="password">Clave de Acceso (ok)</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Introduce la clave secreta"
              required
            />
          </div>
          <div class="social-links">
            <a href="#" aria-label="Instagram"
              ><img src="img/logo_instagram.png" alt="Instagram"
            /></a>
            <a href="#" aria-label="Facebook"
              ><img src="img/logo_facebook.png" alt="Facebook"
            /></a>
            <a href="#" aria-label="Twitter"
              ><img src="img/logo_twitter.png" alt="Twitter"
            /></a>
          </div>
          <button type="submit" class="login-button">Iniciar Sesión</button>
        </form>
      </div>
    </section>

    <script src="login.js"></script>
  </body>
</html>
